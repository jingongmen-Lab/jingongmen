<!DOCTYPE html>              <!-- 声明：这是一份 HTML5 文档，固定写法 -->
<html lang="zh-CN">          <!-- 网页整体开始，lang 表示内容是简体中文 -->
  <head>              <!-- 头部：给浏览器看的配置信息，访客看不到 -->
    <meta charset="UTF-8">   <!-- 文字编码，保证中文不乱码 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系我们-兴农科技</title>  <!-- 浏览器标签页上显示的标题 -->
    <link rel="stylesheet" href="css/style.css">
  </head>
  
  <body>
    <header class="site-header">
        <h1>兴农科技</h1>
        <nav class="site-nav">
          <a href="index.html">首页</a>
          <a href="about.html">关于我们</a>
          <a href="solutions.html">解决方案</a>
          <a href="news.html">新闻动态</a>
          <a href="contact.html">联系我们</a>
        </nav>
      </header><!-- 主体内容 -->
    <main>
        <h2>联系我们</h2>
        <form class="contact-form">
          <label for="name">姓名</label>
          <input type="text" id="name" placeholder="请输入您的姓名" autocomplete="name">
  
          <label for="phone">电话</label>
          <input type="tel" id="phone" placeholder="请输入手机号" autocomplete="tel">
  
          <label for="message">留言内容</label>
          <textarea id="message" rows="4" placeholder="想对我们说的话"></textarea>
  
          <button type="submit">提交留言</button>
        </form>
    </main>

    <!-- 页脚 -->
    <footer>
      <p>© 2026 兴农科技 · 练手项目</p>
    </footer>
    <script src="js/main.js"></script>
  </body>
</html>
